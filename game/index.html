<!doctype html>
<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>The Velvet Vault — A Midnight Heist</title>

  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0a12; }

</style>
</head>
<body>
<canvas id="game" aria-label="The Velvet Vault: a stealth heist game. Sneak past guards and cameras, steal the Star of Midnight, and leave by the service door."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
